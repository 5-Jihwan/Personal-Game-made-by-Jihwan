<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NEON HANGUL PUZZLE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=VERSION_PLACEHOLDER">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <h1 class="neon-title" data-text="NEON HANGUL">NEON HANGUL</h1>
    <div class="subtitle">한 · 글 · 퍼 · 즐</div>

    <div class="frame">
      <div class="panel left-panel">
        <h2 class="neon-h2">SCORE</h2>
        <div class="row"><span>점수</span><b id="score" class="neon-num">0</b></div>
        <div class="row"><span>최고</span><b id="bestScore" class="neon-num best">0</b></div>
        <div class="row"><span>레벨</span><b id="level" class="neon-num">1</b></div>
        <div class="row"><span>완성</span><b id="wordCount" class="neon-num">0</b></div>
        <div class="row"><span>동시 낙하</span><b id="dropCount" class="neon-num">1</b></div>

        <h2 class="neon-h2">RANKING</h2>
        <ol class="ranking" id="ranking">
          <li class="empty">— 아직 없음 —</li>
        </ol>

        <h2 class="neon-h2">RECENT</h2>
        <div class="recent-words" id="recentWords"></div>

        <h2 class="neon-h2">SOUND</h2>
        <div class="audio-row">
          <button id="bgmBtn" class="audio-btn">BGM ♪</button>
          <button id="sfxBtn" class="audio-btn">SFX ♪</button>
        </div>
        <div class="help-tiny" style="margin-top:6px;">
          사전: <span id="dictStatus">로딩 중...</span>
        </div>

        <h2 class="neon-h2">CONTROL</h2>
        <div class="help">
          <div><kbd>←</kbd> <kbd>→</kbd> 이동</div>
          <div><kbd>↓</kbd> 빠르게</div>
          <div><kbd>SPACE</kbd> 즉시 낙하</div>
          <div><kbd>P</kbd> 일시정지</div>
        </div>
      </div>

      <div class="board-col">
        <div class="board-wrap">
          <canvas id="board"></canvas>
        </div>
        <div class="touch-controls" id="touchControls">
          <div class="tc-cluster tc-left">
            <button class="tc-btn" data-action="left" aria-label="왼쪽">◀</button>
            <button class="tc-btn" data-action="right" aria-label="오른쪽">▶</button>
          </div>
          <div class="tc-cluster tc-right">
            <button class="tc-btn" data-action="down" aria-label="아래">▼</button>
            <button class="tc-btn tc-drop" data-action="drop" aria-label="즉시 낙하">⏬</button>
          </div>
        </div>
      </div>

      <div class="panel right-panel">
        <h2 class="neon-h2">ITEMS</h2>
        <div class="help-tiny">현재 음절에 적용</div>
        <div class="items-grid">
          <button class="item-btn" data-item="cho" id="item-cho">
            <span class="key">[1]</span>
            <span class="name">자음 변경</span>
            <span class="count">×<span id="cnt-cho">2</span></span>
          </button>
          <button class="item-btn" data-item="jung" id="item-jung">
            <span class="key">[2]</span>
            <span class="name">모음 변경</span>
            <span class="count">×<span id="cnt-jung">2</span></span>
          </button>
          <button class="item-btn" data-item="stop" id="item-stop">
            <span class="key">[3]</span>
            <span class="name">STOP</span>
            <span class="count">×<span id="cnt-stop">1</span></span>
          </button>
          <button class="item-btn" data-item="wild" id="item-wild">
            <span class="key">[4]</span>
            <span class="name">만능 글자</span>
            <span class="count">×<span id="cnt-wild">1</span></span>
          </button>
        </div>

        <h2 class="neon-h2">RULES</h2>
        <div class="help-tiny">
          가로로 인접한 음절이 사전 단어가 되면 사라집니다.
          단어가 길수록 점수와 아이템 보상이 커집니다.
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="box">
      <h2 class="neon-title small" id="overlayTitle" data-text="GAME OVER">GAME OVER</h2>
      <p id="overlayMsg" class="overlay-msg">최종 점수: 0</p>
      <div class="name-row" id="nameInputRow" style="display:none;">
        <input id="nameInput" type="text" placeholder="이름 (최대 10자)" maxlength="10" autocomplete="off" />
        <button id="saveScoreBtn" class="neon-btn small">저장</button>
      </div>
      <button id="restartBtn" class="neon-btn">RESTART</button>
    </div>
  </div>

  <script src="js/data.js?v=VERSION_PLACEHOLDER"></script>
  <script src="js/dict.js?v=VERSION_PLACEHOLDER"></script>
  <script src="js/audio.js?v=VERSION_PLACEHOLDER"></script>
  <script src="js/game.js?v=VERSION_PLACEHOLDER"></script>
  <script src="js/render.js?v=VERSION_PLACEHOLDER"></script>
  <script src="js/main.js?v=VERSION_PLACEHOLDER"></script>
</body>
</html>
