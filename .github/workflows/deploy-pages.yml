name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/korean-word-puzzle-game-22KGf
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 캐시 버스팅: 모든 자산 URL 의 ?v=VERSION_PLACEHOLDER 를 커밋 해시로 치환
      - name: Cache-bust assets
        run: |
          VERSION="${GITHUB_SHA::8}-$(date +%s)"
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" index.html
          echo "Asset version: ${VERSION}"

      # Firebase 설정이 GitHub Secrets 에 있다면 firebase-config.js 를 자동 주입
      # (선택 사항 — Secrets 가 없으면 git 에 커밋된 파일을 그대로 사용)
      - name: Inject Firebase config (optional)
        if: env.FIREBASE_CONFIG != ''
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "window.FIREBASE_CONFIG = ${FIREBASE_CONFIG};" > js/firebase-config.js
          echo "Firebase config injected from secret"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
